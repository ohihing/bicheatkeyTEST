<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>심리테스트 관리자 대시보드</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #f4f6f8; color: #333; padding: 32px 20px 60px; }
        .container { max-width: 900px; margin: 0 auto; }

        /* 헤더 */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 28px; flex-wrap: wrap; gap: 12px; }
        .header h1 { font-size: 22px; color: #2c3e50; font-weight: 800; }
        .btn-reload { padding: 10px 18px; border: none; background: #2c3e50; color: white;
            border-radius: 10px; cursor: pointer; font-weight: 600; font-size: 14px;
            transition: background 0.2s; }
        .btn-reload:hover { background: #3d5166; }

        /* 카드 */
        .card-row { display: flex; gap: 16px; margin-bottom: 24px; flex-wrap: wrap; }
        .card { flex: 1; min-width: 180px; background: white; padding: 22px 20px;
            border-radius: 16px; box-shadow: 0 3px 10px rgba(0,0,0,0.06); text-align: center; }
        .card h3 { font-size: 13px; color: #7f8c8d; margin-bottom: 10px; font-weight: 600; letter-spacing: 0.2px; }
        .card p  { font-size: 32px; font-weight: 800; color: #27ae60; line-height: 1.1; }
        .card p.small { font-size: 20px; margin-top: 4px; }

        /* 차트 */
        .chart-container { background: white; padding: 28px 24px; border-radius: 16px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.06); margin-bottom: 24px; }
        .chart-container h3 { margin-bottom: 20px; font-size: 17px; color: #2c3e50; font-weight: 700; }
        .chart-wrap { position: relative; height: 280px; }

        /* 테이블 */
        .table-wrap { background: white; border-radius: 16px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.06); overflow: hidden; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 14px 18px; text-align: left; border-bottom: 1px solid #f0f0f0; font-size: 14px; }
        th { background: #fafafa; font-weight: 700; color: #666; font-size: 13px; }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background: #fafcff; }
        td:last-child, th:last-child { text-align: right; }
        .badge { display: inline-block; background: #eef3fb; color: #28549e;
            font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 20px; }
        .pct { font-weight: 700; color: #27ae60; }

        /* 반응형 */
        @media (max-width: 600px) {
            body { padding: 20px 14px 40px; }
            .header h1 { font-size: 18px; }
            th, td { padding: 11px 12px; font-size: 13px; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>📊 나의 선 긋기 유형 — 통계 대시보드</h1>
        <button class="btn-reload" onclick="location.reload()">새로고침</button>
    </div>

    <div class="card-row">
        <div class="card">
            <h3>총 참여자 수</h3>
            <p id="total-users">0명</p>
        </div>
        <div class="card">
            <h3>최다 결과 유형</h3>
            <p id="top-type" class="small">-</p>
        </div>
        <div class="card">
            <h3>유형 수</h3>
            <p>8가지</p>
        </div>
    </div>

    <div class="chart-container">
        <h3>유형별 참여 현황</h3>
        <div class="chart-wrap">
            <canvas id="typeChart"></canvas>
        </div>
    </div>

    <div class="table-wrap">
        <table>
            <thead>
                <tr>
                    <th>#</th>
                    <th>유형명</th>
                    <th>코드</th>
                    <th>참여 수</th>
                    <th>비율</th>
                </tr>
            </thead>
            <tbody id="table-body"></tbody>
        </table>
    </div>
</div>
<script src="admin.js"></script>
</body>
</html>
