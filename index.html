<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>오피스 생존을 위한 나의 선 긋기 유형</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <button id="back-btn" class="header-btn hidden">❮</button>
            <img src="assets/header.png" class="header-logo" alt="헤더" onerror="this.style.opacity='0'">
            <div class="header-btn placeholder"></div>
        </header>

        <section id="main-screen" class="screen active">
            <div class="main-image-placeholder">
                <img src="assets/main_image.png" alt="메인 이미지" onerror="this.src='https://via.placeholder.com/400x400?text=Main+Image'">
            </div>
            <h1 class="title">오피스 생존을 위한<br>나의 선 긋기 유형</h1>
            <p class="subtitle">직장 생활 중 마주하는 무례한 질문, 갈등 상황에서<br>나는 어떻게 내 멘탈을 보호하고 있을까?</p>
            <button id="start-btn" class="btn-primary">테스트 시작하기</button>
        </section>

        <section id="question-screen" class="screen">
            <div class="progress-bar-container">
                <div id="progress-bar" class="progress-bar"></div>
            </div>
            <div class="question-count"><span id="current-q">1</span> / 12</div>
            
            <div id="q-content" style="width:100%;">
                <h2 id="question-text" class="question-text">질문 텍스트</h2>
                <div class="question-image-placeholder">
                    <img id="q-image" src="" alt="질문 이미지" onerror="this.src='https://via.placeholder.com/400x300?text=Question+Image'">
                </div>
                <div class="options-container">
                    <button class="btn-option" onclick="selectOption(0)"></button>
                    <button class="btn-option" onclick="selectOption(1)"></button>
                </div>
            </div>
        </section>

        <section id="loading-screen" class="screen">
            <div class="spinner"></div>
            <h2>결과 분석 중...</h2>
            <p>나의 선 긋기 유형을 찾고 있습니다.</p>
        </section>

        <section id="result-screen" class="screen">
            <div id="capture-area" class="capture-wrap">
                <h2 id="result-title" class="result-title">결과 타이틀</h2>
                <div class="result-image-placeholder">
                    <img id="result-image" src="" alt="결과 이미지" onerror="this.src='https://via.placeholder.com/400x400?text=Result+Image'">
                </div>
                <div class="result-desc-box">
                    <h3>유형 해설</h3>
                    <p id="result-desc">결과 설명이 여기에 들어갑니다.</p>
                </div>
                <div class="result-solution-box">
                    <h3>💊 흔들리지 않는 멘탈을 위한 맞춤 처방전</h3>
                    <div class="book-image-placeholder">
                        <img src="assets/book.png" alt="도서 이미지" onerror="this.src='https://via.placeholder.com/200x250?text=Book+Image'">
                    </div>
                    <p id="result-solution">책 내용 기반 솔루션</p>
                </div>
            </div>
            <div class="action-buttons">
                <button id="save-img-btn" class="btn-primary">📸 내 유형 이미지로 저장하기</button>
                <button id="share-btn" class="btn-secondary">🔗 테스트 링크 공유하기</button>
                <div class="flex-btn-group">
                    <button id="other-types-btn" class="btn-outline half-btn">다른 유형 보기</button>
                    <button id="restart-btn" class="btn-outline half-btn">다시하기</button>
                </div>
            </div>

            <div class="bookstore-section">
                <h3>도서 자세히 보기</h3>
                <div class="bookstore-links">
                    <a href="https://product.kyobobook.co.kr/detail/S000221031963" target="_blank" rel="noopener noreferrer" class="store-btn">
                        <img src="assets/ci_kyobo.png" alt="교보문고" onerror="this.src='https://via.placeholder.com/80x30?text=KYOBO'">
                    </a>
                    <a href="https://www.aladin.co.kr/shop/wproduct.aspx?ItemId=400985198" target="_blank" rel="noopener noreferrer" class="store-btn">
                        <img src="assets/ci_aladin.png" alt="알라딘" onerror="this.src='https://via.placeholder.com/80x30?text=ALADIN'">
                    </a>
                    <a href="https://www.yes24.com/product/goods/195429331" target="_blank" rel="noopener noreferrer" class="store-btn">
                        <img src="assets/ci_yes24.png" alt="YES24" onerror="this.src='https://via.placeholder.com/80x30?text=YES24'">
                    </a>
                </div>
            </div>
        </section>

        <footer class="app-footer">
            <img src="assets/logo.png" alt="푸터 로고" onerror="this.src='https://via.placeholder.com/100x30?text=LOGO'">
            <p>&copy; 2026 KYOBO BOOK CENTRE. All rights reserved.</p>
        </footer>

        <div id="other-modal" class="modal-overlay hidden">
            <div class="modal-content">
                <button class="modal-close" onclick="closeModal()">✕</button>
                <h3>전체 8가지 유형 보기</h3>
                <div class="types-grid" id="types-grid">
                    </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
